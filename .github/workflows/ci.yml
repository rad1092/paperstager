name: Build, native smoke, and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paperstager-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  NUGET_XMLDOC_MODE: skip

jobs:
  verify:
    name: Verify ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.401'
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Install Python for release verification
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Install Linux native display dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libfontconfig1 libx11-6 libice6 libsm6 libxext6 libxrandr2 libxi6
      - name: Confirm native architecture
        run: |
          python -c "import platform; print(platform.platform(), platform.machine())"
          dotnet --info
      - name: Check release tooling and credential patterns
        run: |
          python -m unittest discover -s scripts -p 'test_*.py' -v
          python scripts/security_scan.py
      - name: Restore locked dependencies and fail on incomplete audit
        run: >-
          dotnet restore PaperStager.slnx --locked-mode
          -p:NuGetAudit=true -p:NuGetAuditMode=all -p:NuGetAuditLevel=moderate
          -warnaserror:NU1900,NU1902,NU1903,NU1904,NU1905
      - name: Audit direct and transitive dependencies
        run: python scripts/audit_dependencies.py
      - name: Build
        run: dotnet build PaperStager.slnx --configuration Release --no-restore -p:ContinuousIntegrationBuild=true
      - name: Test core and desktop flows
        run: >-
          dotnet test PaperStager.slnx --configuration Release --no-build
          --logger 'trx;LogFilePrefix=tests' --results-directory artifacts/tests
      - name: Publish a self-contained desktop package
        run: >-
          dotnet publish src/PaperStager.App/PaperStager.App.csproj
          --configuration Release --runtime ${{ matrix.rid }} --self-contained true
          -p:RestoreLockedMode=true -p:NuGetAudit=true -p:NuGetAuditMode=all -p:NuGetAuditLevel=moderate
          -warnaserror:NU1900,NU1902,NU1903,NU1904,NU1905
          -p:PublishSingleFile=false -p:PublishTrimmed=false -p:DebugType=None -p:DebugSymbols=false
          -p:ContinuousIntegrationBuild=true -p:RepositoryCommit=${{ github.sha }}
          --output artifacts/publish/${{ matrix.rid }}
      - name: Package native app with licenses and source metadata
        run: >-
          python scripts/release.py package
          --publish-dir artifacts/publish/${{ matrix.rid }}
          --rid ${{ matrix.rid }} --sha ${{ github.sha }}
      - name: Unpack, launch, exercise workflow, close, and restart
        run: >-
          python scripts/release.py smoke
          --archive artifacts/release/PaperStager-*-${{ matrix.rid }}.zip
          --sha ${{ github.sha }} --output artifacts/smoke/${{ matrix.rid }}
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: evidence-${{ matrix.rid }}-${{ github.sha }}
          path: |
            artifacts/tests/
            artifacts/security/
            artifacts/smoke/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload verified portable package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: package-${{ matrix.rid }}
          path: |
            artifacts/release/*.zip
            artifacts/release/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish verified release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out release tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Download packages that passed native launch tests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: package-*
          path: artifacts/release
          merge-multiple: true
      - name: Verify package checksums and exact source revision
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: >-
          python3 scripts/release.py checksums --directory artifacts/release
          --sha "$RELEASE_SHA" --tag "$RELEASE_TAG"
      - name: Publish portable archives and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          Path('artifacts/release/release-notes.md').write_text(
              'Review-first, offline PDF document intake for macOS (Apple Silicon), Windows x64, and Linux x64.\n\n'
              'Each portable ZIP contains the .NET runtime, documentation, and third-party notices. '
              'Read the included quickstart for native system requirements and launch instructions.\n\n'
              'Packages passed native unpack-and-launch smoke tests on all three operating systems, '
              'including a second launch. These packages are not Developer ID signed, Authenticode signed, '
              'or Apple notarized. Do not disable operating-system security controls.\n\n'
              f"Source commit: `{os.environ['RELEASE_SHA']}`\n\n"
              'Check downloads against `SHA256SUMS` before running them.\n', encoding='utf-8')
          PY
          gh release create "$RELEASE_TAG" --verify-tag --target "$RELEASE_SHA" \
            --title "PaperStager $RELEASE_TAG" --notes-file artifacts/release/release-notes.md \
            artifacts/release/*.zip artifacts/release/SHA256SUMS
